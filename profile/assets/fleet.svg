<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="WinSell open source fleet">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .amber { fill: #f5a623; }
    .green { fill: #3ddc84; }
    .grey  { fill: #8b949e; }
    .dim   { fill: #5a6572; }
  </style>

  <rect x="0" y="0" width="900" height="200" rx="10" fill="#0b0f14" />
  <rect x="0" y="0" width="900" height="32" fill="#121a22" />
  <rect x="0" y="31" width="900" height="1" fill="#1f2933" />

  <circle cx="20" cy="16" r="4.5" fill="#ff5f56" />
  <circle cx="36" cy="16" r="4.5" fill="#ffbd2e" />
  <circle cx="52" cy="16" r="4.5" fill="#27c93f" />
  <text class="mono grey" x="72" y="20" font-size="11.5">fleet — winsell</text>

  <g>
    <rect x="30" y="52" width="400" height="60" rx="8" fill="#0e151b" stroke="#1f2933" />
    <text class="mono dim" x="46" y="74" font-size="10" letter-spacing="2">SOCIAL-HIVE</text>
    <text class="mono green" x="46" y="96" font-size="14">SEO / GEO / AEO content engine</text>
    <text class="mono grey" x="330" y="96" font-size="11.5">MIT</text>
  </g>

  <g>
    <rect x="30" y="122" width="400" height="60" rx="8" fill="#0e151b" stroke="#1f2933" />
    <text class="mono dim" x="46" y="144" font-size="10" letter-spacing="2">WISA-CONNECT</text>
    <text class="mono green" x="46" y="166" font-size="14">Desktop client for AI gateways</text>
    <text class="mono grey" x="330" y="166" font-size="11.5">MIT</text>
  </g>

  <rect x="470" y="48" width="1" height="134" fill="#1f2933" />

  <text class="mono dim" x="500" y="60" font-size="10" letter-spacing="2">CAPABILITIES</text>
  <text class="mono grey" x="500" y="82" font-size="12">AI content agents · UGC engine</text>
  <text class="mono grey" x="500" y="100" font-size="12">JSON-LD · llms.txt · sitemaps</text>
  <text class="mono grey" x="500" y="118" font-size="12">Multi-tenant SaaS · admin plane</text>
  <text class="mono grey" x="500" y="136" font-size="12">LLM gateway · desktop clients</text>
  <text class="mono grey" x="500" y="154" font-size="12">CI/CD · observability · hardening</text>

  <text class="mono amber" x="500" y="178" font-size="12">Open source by default.</text>

  <rect x="0.5" y="0.5" width="899" height="199" rx="10" fill="none" stroke="#1f2933" />
</svg>
