name: General
description: Questions, ideas and anything that does not fit the other categories.
title: "[discussion] "
body:
  - type: markdown
    attributes:
      value: |
        Keep it concrete. Say what you are trying to do, what you tried, and what
        happened instead. Issues and pull requests are handled in the issue
        tracker, so use this space for open-ended conversation.

  - type: textarea
    id: topic
    attributes:
      label: Topic
      description: What is this discussion about, in one or two sentences?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant code, configuration, versions or links. Include the repository and file path where possible.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would make this thread resolved for you?
    validations:
      required: false
